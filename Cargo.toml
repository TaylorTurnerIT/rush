[package]
name = "codecrafters-shell"
version = "0.1.0"
authors = ["Codecrafters <hello@codecrafters.io>"]
edition = "2024"
rust-version = "1.95"

[dependencies]
anyhow = "1.0.68"                                # error handling
bytes = "1.3.0"                                  # helps manage buffers
thiserror = "1.0.38"

[[bin]]
name = "codecrafters-shell"
path = "src/main.rs"

[[bin]]
name = "echo"
path = "src/builtin/echo/main.rs"

[[bin]]
name = "type"
path = "src/builtin/type/main.rs"
